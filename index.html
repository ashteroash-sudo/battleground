<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Table de Combat — VTM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#140d10;
    --panel:#1c1215;
    --panel-alt:#241619;
    --border:#3a262c;
    --text:#ece4e2;
    --text-dim:#a4898d;
    --blood:#8f1c2e;
    --blood-bright:#c9283f;
    --gold:#b6903f;
    --radius:10px;
    --font-display:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --font-ui:'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  :root[data-theme="light"]{
    --bg:#e9e0d4;
    --panel:#f3ebdd;
    --panel-alt:#ece1cf;
    --border:#c8b593;
    --text:#251a16;
    --text-dim:#6c5847;
    --blood:#8f1c2e;
    --blood-bright:#c9283f;
    --gold:#8a6a24;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    min-height:100vh;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 24px;
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
    gap:12px;
  }
  h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:2.1rem;
    margin:0;
    letter-spacing:0.02em;
  }
  h1 span{color:var(--blood-bright);}
  .header-controls{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .music-panel{display:flex; align-items:center; gap:8px;}
  .music-filename{font-size:0.8rem; color:var(--text-dim); max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  button{
    font-family:var(--font-ui);
    cursor:pointer;
  }
  .btn{
    background:var(--panel-alt);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 18px;
    border-radius:var(--radius);
    font-size:0.95rem;
    font-weight:600;
    transition:background .15s, border-color .15s;
  }
  .btn:hover{border-color:var(--gold);}
  .btn.lock-on{background:var(--blood); border-color:var(--blood-bright); color:#fff;}
  .btn.ghost{background:transparent;}

  main{
    display:grid;
    grid-template-columns:400px minmax(420px,1fr) 400px;
    gap:32px;
    padding:24px 36px 40px;
    max-width:none;
    margin:0;
    align-items:stretch;
    min-height:calc(100vh - 76px);
  }
  main > section{ display:flex; flex-direction:column; min-width:0; }
  @media (max-width: 1200px){
    main{grid-template-columns:320px minmax(320px,1fr) 320px;}
  }
  @media (max-width: 980px){
    main{grid-template-columns:1fr; min-height:auto;}
  }

  .col-title{
    font-family:var(--font-display);
    font-size:1.4rem;
    color:var(--text-dim);
    margin:4px 0 14px;
    border-bottom:1px solid var(--border);
    padding-bottom:8px;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:16px;
    position:relative;
  }
  .player-card{display:flex; gap:16px; align-items:flex-start;}
  .enemy-card{display:flex; gap:16px; align-items:flex-start;}

  .portrait-block{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    min-width:120px;
    border-radius:8px;
    padding:8px;
  }
  .portrait-block.clickable{cursor:pointer;}
  .portrait-block.clickable:hover{background:var(--panel-alt);}

  .avatar{
    position:relative;
    border-radius:50%;
    background:var(--avatar-color, #4a4046);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    border:2px solid var(--border);
    flex:none;
  }
  .avatar.small{width:88px; height:88px;}
  .avatar.large{width:clamp(280px, 62vh, 560px); height:clamp(280px, 62vh, 560px); border-width:4px;}
  .avatar .initial{
    font-family:var(--font-display);
    font-weight:700;
    color:#fff;
    z-index:2;
    text-shadow:0 1px 3px rgba(0,0,0,.5);
  }
  .avatar.small .initial{font-size:2.1rem;}
  .avatar.large .initial{font-size:8rem;}
  .blood-fill{
    position:absolute; left:0; right:0; bottom:0;
    background:linear-gradient(to top, rgba(143,28,46,0.92), rgba(143,28,46,0.45));
    transition:height .35s ease;
    z-index:1;
  }

  .name{font-weight:600; font-size:1.05rem; text-align:center;}
  .duel-slot .name{font-size:1.8rem; margin-top:8px;}

  .hp-row, .soif-row{display:flex; align-items:center; gap:8px; justify-content:center;}
  .hp-row button{
    width:28px; height:28px; border-radius:50%;
    border:1px solid var(--border); background:var(--panel-alt); color:var(--text);
    font-size:1.05rem; line-height:1; padding:0;
  }
  .hp-row span{font-variant-numeric:tabular-nums; font-size:1rem; color:var(--text-dim); min-width:52px; text-align:center;}
  .duel-slot .hp-row span{font-size:1.4rem; min-width:70px; color:var(--text);}
  .duel-slot .hp-row button{width:34px; height:34px; font-size:1.2rem;}

  .pip{
    width:15px; height:15px; border-radius:50%;
    border:1.5px solid var(--blood-bright);
    display:inline-block; cursor:pointer;
  }
  .pip.filled{background:var(--blood-bright);}
  .duel-slot .pip{width:18px; height:18px;}

  .action-card{flex:1; min-width:0;}
  .stat-pool-info{
    font-size:0.75rem; color:var(--text-dim); background:var(--panel-alt);
    border:1px solid var(--border); border-radius:6px; padding:6px 8px; margin-bottom:7px;
    display:grid; grid-template-columns:1fr 1fr; gap:2px 10px;
  }
  .stat-pool-info span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .action-card select, .action-card input, .action-card textarea{
    width:100%;
    background:var(--panel-alt);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:6px;
    padding:9px 10px;
    font-family:var(--font-ui);
    font-size:0.95rem;
    margin-bottom:7px;
  }
  .action-card textarea{min-height:56px; resize:vertical;}
  .action-card select:disabled, .action-card input:disabled, .action-card textarea:disabled{
    opacity:.7; cursor:not-allowed;
  }
  .subtoggle{display:flex; gap:6px; margin-bottom:6px;}
  .subtoggle button{
    flex:1; background:var(--panel-alt); border:1px solid var(--border); color:var(--text-dim);
    border-radius:6px; padding:6px 4px; font-size:0.78rem;
  }
  .subtoggle button.active{border-color:var(--gold); color:var(--text); background:var(--panel);}

  .remove-btn{
    position:absolute; top:6px; right:6px;
    width:20px; height:20px; border-radius:50%;
    border:1px solid var(--border); background:var(--panel-alt); color:var(--text-dim);
    font-size:0.8rem; line-height:1; padding:0;
  }

  .duel-col{display:flex; flex-direction:column; align-items:stretch; gap:14px; flex:1;}
  .duel-arena{
    display:flex; align-items:stretch; justify-content:center; gap:48px;
    flex:1;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:32px 24px;
    position:relative;
  }
  body[data-mode="display"] .duel-arena{
    background: radial-gradient(ellipse at center, #05090b 0%, #0a1820 42%, #17323c 100%);
  }
  .corner{position:absolute; width:44px; height:44px; opacity:0; pointer-events:none;}
  body[data-mode="display"] .corner{opacity:0.85;}
  .corner-tl{top:16px; left:16px; border-top:2px solid var(--border); border-left:2px solid var(--border); border-top-left-radius:6px;}
  .corner-tr{top:16px; right:16px; border-top:2px solid var(--border); border-right:2px solid var(--border); border-top-right-radius:6px;}
  .corner-bl{bottom:16px; left:16px; border-bottom:2px solid var(--border); border-left:2px solid var(--border); border-bottom-left-radius:6px;}
  .corner-br{bottom:16px; right:16px; border-bottom:2px solid var(--border); border-right:2px solid var(--border); border-bottom-right-radius:6px;}

  .duel-info-plate{ display:flex; flex-direction:column; align-items:center; gap:12px; height:134px; justify-content:center; box-sizing:border-box; overflow:hidden; }
  body[data-mode="display"] .duel-info-plate{
    background:transparent;
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
    border-radius:12px;
    padding:14px 34px;
    margin-top:6px;
    width:100%;
  }
  .duel-slot{
    flex:1; display:flex; flex-direction:column; align-items:stretch; gap:14px;
    justify-content:center; max-width:620px;
  }
  .duel-slot .avatar{ align-self:center; }
  .duel-slot.empty{
    color:var(--text-dim);
    font-size:1rem;
    text-align:center;
    padding:0 24px;
    border:1px dashed var(--border);
    border-radius:8px;
    height:100%;
    justify-content:center;
    align-items:center;
  }
  .vs{
    font-family:var(--font-display);
    font-weight:700;
    font-size:2.4rem;
    color:var(--blood-bright);
    flex:none;
    align-self:center;
  }

  .enemy-controls{margin-bottom:16px;}
  .enemy-controls select, .enemy-controls button{
    width:100%; margin-bottom:8px;
    padding:8px; border-radius:6px; border:1px solid var(--border);
    background:var(--panel-alt); color:var(--text); font-size:0.85rem;
  }

  .pool-images{margin-top:16px; border-top:1px solid var(--border); padding-top:14px;}
  .pool-cat-row{
    background:var(--panel); border:1px solid var(--border); border-radius:8px;
    padding:10px; margin-bottom:10px;
  }
  .pool-cat-label{font-size:0.85rem; font-weight:600; margin-bottom:8px;}
  .pool-cat-label small{color:var(--text-dim); font-weight:400;}
  .pool-cat-thumbs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px;}
  .pool-thumb{position:relative; display:inline-block;}
  .pool-thumb-remove{
    position:absolute; top:-6px; right:-6px;
    width:18px; height:18px; border-radius:50%;
    border:1px solid var(--border); background:var(--panel-alt); color:var(--text-dim);
    font-size:0.7rem; line-height:1; padding:0;
  }

  .roster{margin-top:20px; border-top:1px solid var(--border); padding-top:14px;}
  .roster-entry{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--panel); border:1px solid var(--border); border-radius:8px;
    padding:8px 10px; margin-bottom:8px; font-size:0.85rem;
  }
  .roster-entry .re-info{display:flex; flex-direction:column;}
  .roster-entry .re-info small{color:var(--text-dim);}
  .roster-entry .re-actions{display:flex; gap:6px;}
  .roster-entry .re-actions button{
    background:var(--panel-alt); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:5px 8px; font-size:0.75rem;
  }
  .roster-form{
    background:var(--panel); border:1px solid var(--border); border-radius:8px;
    padding:10px; margin-top:10px;
  }
  .roster-form input{
    width:100%; margin-bottom:6px; padding:7px 8px; border-radius:6px;
    border:1px solid var(--border); background:var(--panel-alt); color:var(--text); font-size:0.82rem;
  }
  .roster-form .disc-row{display:flex; gap:6px;}
  .roster-form .disc-row input{flex:1;}
  .roster-form-title{font-size:0.8rem; color:var(--text-dim); margin:8px 0 2px;}
  .small-link{
    background:none; border:none; color:var(--gold); font-size:0.8rem; padding:4px 0;
    text-decoration:underline;
  }

  header, main{ position:relative; z-index:10; }

  body[data-mode="display"]{
    --panel:#0c161a;
    --panel-alt:#0f1e24;
    --border:#25444d;
    --text-dim:#87abb5;
    --gold:#5fa8b5;
    background:
      radial-gradient(ellipse at 50% 35%, rgba(40,70,85,0.35), transparent 62%),
      linear-gradient(165deg, #050a0d 0%, #0a1820 45%, #04070a 100%);
    color:#d7e6ea;
  }
  body[data-mode="display"]::before{
    content:'';
    position:fixed; inset:0;
    background:radial-gradient(ellipse at center, transparent 32%, rgba(0,0,0,0.92) 100%);
    pointer-events:none;
    z-index:1;
  }
  body[data-mode="display"]::after{
    content:'';
    position:fixed; inset:0;
    opacity:0.05;
    mix-blend-mode:overlay;
    pointer-events:none;
    z-index:2;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  body[data-mode="display"] header{
    border-bottom:1px solid rgba(120,190,210,0.25);
    box-shadow:0 1px 24px rgba(90,160,190,0.12);
  }
  body[data-mode="display"] .edit-only{ display:none !important; }
  body[data-locked="true"] .unlock-only{ display:none !important; }
</style>
</head>
<body>
<header>
  <h1>Table de <span>Combat</span></h1>
  <div class="header-controls edit-only">
    <button class="btn ghost" onclick="resetEncounter()">Réinitialiser la rencontre</button>
    <button class="btn" id="lockBtn" onclick="toggleLock()"></button>
    <span id="musicPanel" class="music-panel">
      <button class="btn ghost" id="musicPickBtn" onclick="document.getElementById('musicFileInput').click()">🎵 Choisir une musique</button>
      <span id="musicControls" style="display:none; align-items:center; gap:8px;">
        <button class="btn ghost" id="musicPlayBtn" onclick="toggleMusicPlay()">⏸️</button>
        <span id="musicFileName" class="music-filename"></span>
        <button class="btn ghost" onclick="clearMusic()">✕</button>
      </span>
      <input type="file" id="musicFileInput" accept="audio/*" style="display:none;" onchange="onMusicFileChosen(this)">
      <audio id="combatAudio" loop></audio>
    </span>
  </div>
  <button class="btn ghost" id="viewToggleBtn" onclick="toggleViewMode()"></button>
</header>

<main>
  <section>
    <div class="col-title">Joueurs</div>
    <div id="playersList"></div>
  </section>

  <section class="duel-col">
    <div class="col-title" style="align-self:stretch;">Duel en cours</div>
    <div class="duel-arena">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>
      <div id="centerPlayer" class="duel-slot"></div>
      <div class="vs">VS</div>
      <div id="centerEnemy" class="duel-slot"></div>
    </div>
  </section>

  <section>
    <div class="col-title">Ennemis</div>
    <div id="enemiesList"></div>

    <div class="enemy-controls edit-only unlock-only">
      <select id="poolSelect"></select>
      <button onclick="addFromPool()">+ Ajouter depuis le pool</button>
    </div>

    <div class="pool-images edit-only unlock-only">
      <div class="col-title" style="margin-bottom:8px;">Portraits génériques (GitHub en priorité, sinon local)</div>
      <div id="poolImagesList"></div>
      <input type="file" id="poolFileInput" accept="image/*" style="display:none;" onchange="onPoolFileChosen(this)">
    </div>

    <div class="roster edit-only unlock-only">
      <div class="col-title" style="margin-bottom:8px;">Répertoire (ennemis nommés)</div>
      <div id="rosterList"></div>
      <button class="small-link" onclick="openRosterForm()">+ Nouvel ennemi nommé</button>
      <div id="rosterFormWrap"></div>
      <div style="display:flex; gap:14px; margin-top:10px;">
        <button class="small-link" onclick="exportRoster()">Exporter le répertoire</button>
        <button class="small-link" onclick="triggerImportRoster()">Importer un répertoire</button>
      </div>
      <input type="file" id="rosterImportInput" accept="application/json" style="display:none;" onchange="handleImportRoster(this)">
    </div>
  </section>
</main>

<script>
const AVATAR_COLORS = ['#6b3a2c','#5c2a3a','#3a4a5c','#4a5c34','#6b5a2c','#4a4046'];
function uid(){ return Math.random().toString(36).slice(2,10); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function val(id){ const el=document.getElementById(id); return el ? el.value.trim() : ''; }

function defaultAction(){
  return {type:'melee', meleeMod:0, distdiscMode:'distance', distanceMod:0, nouvelleMod:0, disciplineName:'', disciplineRoll:'', disciplineCustomMode:false, freeText:'', target:''};
}

function disciplinesFor(entity){
  const own = entity.disciplines || [];
  const clanList = (entity.clan && CLAN_DISCIPLINES[entity.clan]) ? CLAN_DISCIPLINES[entity.clan] : [];
  return own.concat(clanList);
}

const ENEMY_POOL = [
  {label:'Thug', hpMin:3, hpMax:6, category:'thug', volMin:3, volMax:4, combatMin:5, combatMax:7, socialMin:5, socialMax:6, mentalMin:3, mentalMax:4},
  {label:'Vampire', hpMin:5, hpMax:8, category:'vampire', volMin:5, volMax:6, combatMin:6, combatMax:8, socialMin:5, socialMax:7, mentalMin:5, mentalMax:6},
  {label:'Ordre', hpMin:4, hpMax:6, category:'ordre', volMin:5, volMax:5, combatMin:6, combatMax:7, socialMin:5, socialMax:6, mentalMin:5, mentalMax:6},
  {label:'Civil', hpMin:3, hpMax:5, category:'civil', volMin:3, volMax:4, combatMin:3, combatMax:4, socialMin:3, socialMax:5, mentalMin:3, mentalMax:4}
];

function rollRange(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }

const PORTRAIT_CATEGORIES = ['thug','vampire','ordre','civil'];

let DISPLAY_MODE = sessionStorage.getItem('vtm_view_mode') === 'display';

function toggleViewMode(){
  DISPLAY_MODE = !DISPLAY_MODE;
  sessionStorage.setItem('vtm_view_mode', DISPLAY_MODE ? 'display' : 'edit');
  document.body.dataset.mode = DISPLAY_MODE ? 'display' : 'edit';

window.addEventListener('storage', (e)=>{
  if(e.key === 'vtm_battle_state' || e.key === 'vtm_roster' || e.key === 'vtm_portrait_pools'){
    loadState(); render();
  }
});

function loadState(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem('vtm_battle_state')); }catch(e){}
  state = saved || {locked:false, players:JSON.parse(JSON.stringify(DEFAULT_PLAYERS)), enemies:[], center:{player:null, enemy:null}};
  // synchronise toujours le portrait des joueurs avec les valeurs par défaut (pas d'édition de portrait joueur en jeu, donc pas de risque d'écraser une modification faite ici)
  state.players.forEach(p=>{
    const def = DEFAULT_PLAYERS.find(d=>d.id===p.id);
    if(def && def.image) p.image = def.image;
    if(def && def.video) p.video = def.video;
    if(!p.disciplines){
      if(def && def.disciplines) p.disciplines = def.disciplines;
    }
    if(!p.clan){
      if(def && def.clan) p.clan = def.clan;
    }
  });
  // rétro-compatibilité : les ennemis créés avant l'ajout du cadre d'action n'en ont pas encore
  state.enemies.forEach(e=>{
    if(!e.action) e.action = defaultAction();
  });
  let savedRoster = null;
  try{ savedRoster = JSON.parse(localStorage.getItem('vtm_roster')); }catch(e){}
  roster = savedRoster || [];
  let savedPools = null;
  try{ savedPools = JSON.parse(localStorage.getItem('vtm_portrait_pools')); }catch(e){}
  portraitPools = savedPools || {thug:[], vampire:[], ordre:[], civil:[]};
  PORTRAIT_CATEGORIES.forEach(c=>{ if(!portraitPools[c]) portraitPools[c] = []; });
}
function saveState(){ localStorage.setItem('vtm_battle_state', JSON.stringify(state)); }
function saveRoster(){ localStorage.setItem('vtm_roster', JSON.stringify(roster)); }
function savePortraitPools(){ localStorage.setItem('vtm_portrait_pools', JSON.stringify(portraitPools)); }


function resetEncounter(){
  if(!confirm('Réinitialiser PV, soif, actions des joueurs et vider les ennemis ?')) return;
  state = {locked:false, players:JSON.parse(JSON.stringify(DEFAULT_PLAYERS)), enemies:[], center:{player:null, enemy:null}};
  saveState(); render();
}

function toggleLock(){ state.locked = !state.locked; saveState(); render(); }

function adjustHp(type, id, delta){
  const arr = type==='player' ? state.players : state.enemies;
  const e = arr.find(x=>x.id===id);
  if(!e) return;
  e.hp = Math.max(0, Math.min(e.maxHp, e.hp + delta));
  saveState(); render();
}

function setSoif(id, target){
  const p = state.players.find(x=>x.id===id);
  p.soif = Math.max(0, Math.min(5, target));
  saveState(); render();
}

function updateAction(id, field, value){
  const p = state.players.find(x=>x.id===id);
  p.action[field] = value;
  saveState(); render();
}

function updateActionText(id, field, value){
  const p = state.players.find(x=>x.id===id);
  p.action[field] = value;
  saveState(); // pas de render() ici : garde le focus pendant la saisie

function selectEnemyDiscipline(id, idx){
  const e = state.enemies.find(x=>x.id===id);
  if(!e) return;
  if(!e.action) e.action = defaultAction();
  if(idx === '__custom__'){
    e.action.disciplineCustomMode = true;
    e.action.disciplineName = '';
    e.action.disciplineRoll = '';
  } else if(idx === ''){
    e.action.disciplineName = '';
    e.action.disciplineRoll = '';
  } else {
    const d = disciplinesFor(e)[parseInt(idx)];
    if(d){
      e.action.disciplineName = d.name;
      e.action.disciplineRoll = d.jet || '';
    }
  }
  saveState(); render();
}

const GITHUB_OWNER = 'ashteroash-sudo';
const GITHUB_REPO = 'battleground';
const GITHUB_BRANCH = 'main'; // à changer ici si le dépôt utilise une autre branche par défaut (ex: 'master')
let githubImageCache = {}; // category -> [urls] une fois récupéré, mis en cache pour la session

async function fetchGithubCategoryImages(category){
  if(githubImageCache[category] !== undefined && githubImageCache[category].length > 0){
    return githubImageCache[category];
  }
  try{
    const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${category}?ref=${GITHUB_BRANCH}`);
    if(!res.ok){ return []; } // pas de mise en cache d'un échec : on réessaiera au prochain ajout
    const data = await res.json();
    const imgs = (Array.isArray(data) ? data : [])
      .filter(f => f.type === 'file' && /\.(png|jpe?g|webp|gif)$/i.test(f.name))
      .map(f => f.download_url);
    if(imgs.length > 0) githubImageCache[category] = imgs; // on ne met en cache que les succès non vides
    return imgs;
  } catch(e){
    return []; // pas de mise en cache d'un échec non plus
  }
}

async function addFromPool(){
  const i = parseInt(document.getElementById('poolSelect').value);
  const t = ENEMY_POOL[i];
  const hp = rollRange(t.hpMin, t.hpMax);
  const statPool = {
    volonte: rollRange(t.volMin, t.volMax),
    combat: rollRange(t.combatMin, t.combatMax),
    social: rollRange(t.socialMin, t.socialMax),
    mental: rollRange(t.mentalMin, t.mentalMax)
  };
  let image;
  const githubImgs = await fetchGithubCategoryImages(t.category);
  if(githubImgs.length){
    image = githubImgs[Math.floor(Math.random()*githubImgs.length)];
  } else {
    const localPool = portraitPools[t.category] || [];
    if(localPool.length) image = localPool[Math.floor(Math.random()*localPool.length)];
  }
  state.enemies.push({id:uid(), baseName:t.label, hp:hp, maxHp:hp, color:AVATAR_COLORS[5], image, statPool, action:defaultAction()});
  saveState(); render();
}

function pickPortraitPoolFile(category){
  const input = document.getElementById('poolFileInput');
  input.dataset.category = category;
  input.click();
}

function onPoolFileChosen(input){
  const file = input.files && input.files[0];
  const category = input.dataset.category;
  if(!file || !category) return;
  readAndResizeImage(file, function(dataUrl){
    portraitPools[category].push(dataUrl);
    savePortraitPools();
    input.value = '';
    render();
  });
}

function removePoolImage(category, idx){
  portraitPools[category].splice(idx, 1);
  savePortraitPools();
  render();
}

}

  state.enemies = state.enemies.filter(e=>e.id!==id);

function readAndResizeImage(file, callback){
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const size = 220;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(size/img.width, size/img.height);
      const w = img.width*scale, h = img.height*scale;
      ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function onRosterImageChange(input){
  const file = input.files && input.files[0];
  if(!file) return;
  readAndResizeImage(file, function(dataUrl){
    rosterDraftImage = dataUrl;
    const el = document.getElementById('rf-preview');
    if(el) el.innerHTML = `<img src="${dataUrl}" style="width:56px;height:56px;border-radius:50%;object-fit:cover;">`;
  });
}

function clearRosterImage(){
  rosterDraftImage = null;
  const el = document.getElementById('rf-preview');
  if(el) el.innerHTML = '';
}

function commitRoster(){
  const name = val('rf-name');
  if(!name){ alert('Le nom est requis.'); return; }
  const hp = parseInt(val('rf-hp')) || 1;
  const arme = val('rf-arme');
  const clan = val('rf-clan');
  const disciplines = [];
  for(let i=1;i<=3;i++){
    const n = val('rf-d'+i+'n'), j = val('rf-d'+i+'j');
    if(n) disciplines.push({name:n, jet:j});
  }
  const editingEntry = rosterEditingId ? roster.find(x=>x.id===rosterEditingId) : null;
  const image = rosterDraftImage === undefined
    ? (editingEntry ? editingEntry.image : undefined)
    : (rosterDraftImage === null ? undefined : rosterDraftImage);
  if(editingEntry){
    Object.assign(editingEntry, {name, hp, arme, clan, disciplines, image});
  } else {
    roster.push({id:uid(), name, hp, arme, clan, disciplines, image});
  }
  saveRoster();
  rosterEditingId = undefined;
  rosterDraftImage = undefined;
  render();
}

function deleteRoster(id){
  if(!confirm('Supprimer cet ennemi du répertoire ?')) return;
  roster = roster.filter(r=>r.id!==id);
  saveRoster(); render();
}

function exportRoster(){
  const dataStr = JSON.stringify(roster, null, 2);
  const blob = new Blob([dataStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'repertoire-ennemis-vtm.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function triggerImportRoster(){
  document.getElementById('rosterImportInput').click();
}

function handleImportRoster(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    let imported;
    try{ imported = JSON.parse(ev.target.result); }catch(e){ alert('Fichier invalide ou corrompu.'); input.value=''; return; }
    if(!Array.isArray(imported)){ alert('Format de fichier inattendu.'); input.value=''; return; }
    if(!confirm(`Ajouter ${imported.length} ennemi(s) du fichier au répertoire actuel (répertoire actuel conservé) ?`)){ input.value=''; return; }
    imported.forEach(item=>{
      roster.push({
        id: uid(),
        name: item.name || 'Sans nom',
        hp: item.hp || 1,
        arme: item.arme || '',
        disciplines: item.disciplines || [],
        image: item.image || undefined
      });
    });
    saveRoster();
    input.value = '';
    render();
  };
  reader.readAsText(file);
}

/* ---------- render helpers ---------- */

function avatarHTML(entity, size){
  const ratio = entity.maxHp>0 ? 1-(entity.hp/entity.maxHp) : 0;
  let inner;
  if(entity.video){
    inner = `<video autoplay loop muted playsinline style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0;"><source src="${entity.video}" type="video/webm"></video>`;
  } else if(entity.image){
    inner = `<img src="${entity.image}" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0;">`;
  } else {
    inner = `<span class="initial">${esc(entity.name.charAt(0).toUpperCase())}</span>`;
  }
  return `<div class="avatar ${size}" style="--avatar-color:${entity.color||'#4a4046'}">
    ${inner}
    <div class="blood-fill" style="height:${Math.max(0,Math.min(100,Math.round(ratio*100)))}%"></div>
  </div>`;
}

function hpControl(entity, type){
  if(DISPLAY_MODE){
    if(type === 'enemy') return ''; // PV ennemis jamais chiffrés en vue joueurs, seul le sang visuel parle
    return `<div class="hp-row"><span>${entity.hp} / ${entity.maxHp}</span></div>`;
  }
  return `<div class="hp-row">
    <button onclick="adjustHp('${type}','${entity.id}',-1)">–</button>
    <span>${entity.hp} / ${entity.maxHp}</span>
    <button onclick="adjustHp('${type}','${entity.id}',1)">+</button>
  </div>`;
}

function soifControl(p){
  let dots = '';
  for(let i=1;i<=5;i++){
    if(DISPLAY_MODE){
      dots += `<span class="pip ${i<=p.soif?'filled':''}"></span>`;
    } else {
      const target = (i===p.soif) ? i-1 : i;
      dots += `<span class="pip ${i<=p.soif?'filled':''}" onclick="setSoif('${p.id}',${target})"></span>`;
    }
  }
  return `<div class="soif-row" title="Soif">${dots}</div>`;
}

function modSelect(id, field, val, disabled, updateFn){
  let opts = '';
  for(let i=0;i<=3;i++){ opts += `<option value="${i}" ${val===i?'selected':''}>+${i}</option>`; }
  return `<select ${disabled} onchange="${updateFn}('${id}','${field}',parseInt(this.value))">${opts}</select>`;
}

function actionPanelHTML(entity, kind){
  const a = entity.action;
  const disabled = (state.locked || DISPLAY_MODE) ? 'disabled' : '';
  const updateFn = kind === 'enemy' ? 'updateEnemyAction' : 'updateAction';
  const updateTextFn = kind === 'enemy' ? 'updateEnemyActionText' : 'updateActionText';
  const targetList = kind === 'enemy' ? state.players : enemiesViewCache;
  let sub = '';
  if(a.type === 'surprise'){
    sub = `<input type="text" ${disabled} placeholder="détail (optionnel)" value="${esc(a.freeText)}" oninput="${updateTextFn}('${entity.id}','freeText',this.value)">`;
  } else if(a.type === 'melee'){
    sub = modSelect(entity.id, 'meleeMod', a.meleeMod, disabled, updateFn);
  } else if(a.type === 'nouvelle'){
    sub = modSelect(entity.id, 'nouvelleMod', a.nouvelleMod, disabled, updateFn);
  } else if(a.type === 'distdisc'){
    sub = `<div class="subtoggle">
        <button class="${a.distdiscMode==='distance'?'active':''}" ${disabled} onclick="${updateFn}('${entity.id}','distdiscMode','distance')">Distance</button>
        <button class="${a.distdiscMode==='discipline'?'active':''}" ${disabled} onclick="${updateFn}('${entity.id}','distdiscMode','discipline')">Discipline</button>
      </div>`;
    if(a.distdiscMode === 'distance'){
      sub += modSelect(entity.id, 'distanceMod', a.distanceMod, disabled, updateFn);
    } else {
      const disciplineList = disciplinesFor(entity);
      const hasOwnDisciplines = disciplineList.length > 0;
      if(hasOwnDisciplines && !a.disciplineCustomMode){
        const selectDisciplineFn = kind === 'enemy' ? 'selectEnemyDiscipline' : 'selectPlayerDiscipline';
        const options = disciplineList.map((d,idx)=>`<option value="${idx}" ${a.disciplineName===d.name?'selected':''}>${esc(d.name)}</option>`).join('');
        sub += `<select ${disabled} onchange="${selectDisciplineFn}('${entity.id}', this.value)">
            <option value="">— choisir une discipline —</option>${options}
            <option value="__custom__">— Autre / hors-clan —</option>
          </select>
          ${a.disciplineRoll ? `<div style="font-size:0.8rem; color:var(--text-dim); padding:0 2px 6px;">${esc(a.disciplineRoll)}</div>` : ''}`;
      } else {
        const exitFn = kind === 'enemy' ? 'exitEnemyCustomDiscipline' : 'exitPlayerCustomDiscipline';
        sub += `<input type="text" ${disabled} placeholder="Nom de la discipline" value="${esc(a.disciplineName)}" oninput="${updateTextFn}('${entity.id}','disciplineName',this.value)">
                <input type="text" ${disabled} placeholder="Jet(s) nécessaire(s)" value="${esc(a.disciplineRoll)}" oninput="${updateTextFn}('${entity.id}','disciplineRoll',this.value)">`;
        if(hasOwnDisciplines){
          sub += `<button type="button" class="small-link" ${disabled} onclick="${exitFn}('${entity.id}')">← revenir à la liste</button>`;
        }
      }
    }
  } else if(a.type === 'autre'){
    sub = `<textarea ${disabled} placeholder="Note libre" oninput="${updateTextFn}('${entity.id}','freeText',this.value)">${esc(a.freeText)}</textarea>`;
  }
  const targetOptions = targetList.map(t=>`<option value="${t.id}" ${a.target===t.id?'selected':''}>${esc(t.name)}</option>`).join('');
  const targetSelect = `<select ${disabled} onchange="${updateFn}('${entity.id}','target',this.value)">
      <option value="">— cible (optionnel) —</option>${targetOptions}
    </select>`;
  const statPoolInfo = (entity.statPool)
    ? `<div class="stat-pool-info">
        <span>Volonté ${entity.statPool.volonte}</span>
        <span>Combat ${entity.statPool.combat}</span>
        <span>Social ${entity.statPool.social}</span>
        <span style="grid-column:span 2;">Mental/Perception ${entity.statPool.mental}</span>
      </div>`
    : '';
  return `<div class="action-card">
    ${statPoolInfo}
    <select ${disabled} onchange="${updateFn}('${entity.id}','type',this.value)">
      <option value="surprise" ${a.type==='surprise'?'selected':''}>Surprise</option>
      <option value="melee" ${a.type==='melee'?'selected':''}>Mêlée continue</option>
      <option value="distdisc" ${a.type==='distdisc'?'selected':''}>Distance / Discipline</option>
      <option value="nouvelle" ${a.type==='nouvelle'?'selected':''}>Nouvelle mêlée</option>
      <option value="autre" ${a.type==='autre'?'selected':''}>Autre</option>
    </select>
    <div class="action-sub">${sub}${targetSelect}</div>
  </div>`;
}

function playerCardHTML(p){
  const clickable = (!DISPLAY_MODE && state.locked);
  return `<div class="card player-card">
    <div class="portrait-block ${clickable?'clickable':''}" ${clickable?`onclick="selectCenter('player','${p.id}')"`:''}>
      ${avatarHTML(p,'small')}
      <div class="name">${esc(p.name)}</div>
      ${hpControl(p,'player')}
      ${soifControl(p)}
    </div>
    ${actionPanelHTML(p,'player')}
  </div>`;
}

function enemyCardHTML(e){
  const clickable = (!DISPLAY_MODE && state.locked);
  return `<div class="card enemy-card">
    ${DISPLAY_MODE ? '' : `<button class="remove-btn" onclick="removeEnemy('${e.id}')" title="Retirer">×</button>`}
    <div class="portrait-block ${clickable?'clickable':''}" ${clickable?`onclick="selectCenter('enemy','${e.id}')"`:''}>
      ${avatarHTML(e,'small')}
      <div class="name">${esc(e.name)}</div>
      ${hpControl(e,'enemy')}
    </div>
    ${DISPLAY_MODE ? '' : actionPanelHTML(e,'enemy')}
  </div>`;
}

function centerSlotHTML(side){
  const id = state.center[side];
  const arr = side==='player' ? state.players : enemiesViewCache;
  const entity = arr.find(x=>x.id===id);
  if(!entity){
    return `<div class="duel-slot empty">Clique un portrait ${side==='player'?'joueur':'ennemi'} (en mode verrouillé) pour l'amener ici</div>`;
  }
  return `${avatarHTML(entity,'large')}
    <div class="duel-info-plate">
      <div class="name">${esc(entity.name)}</div>
      ${hpControl(entity, side==='player'?'player':'enemy')}
      ${side==='player' ? soifControl(entity) : ''}
    </div>`;
}

function rosterEntryHTML(r){
  const discSummary = (r.disciplines||[]).map(d=>d.name).filter(Boolean).join(', ');
  const thumb = r.image
    ? `<img src="${r.image}" style="width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;">`
    : '';
  return `<div class="roster-entry">
    <div class="re-info" style="flex-direction:row; align-items:center; gap:8px;">
      ${thumb}
      <div style="display:flex; flex-direction:column;">
        <strong>${esc(r.name)}</strong>
        <small>${r.hp} PV${r.clan? ' · '+esc(r.clan):''}${r.arme? ' · '+esc(r.arme):''}${discSummary? ' · '+esc(discSummary):''}</small>
      </div>
    </div>
    <div class="re-actions">
      <button onclick="addFromRoster('${r.id}')">+ Combat</button>
      <button onclick="openRosterForm('${r.id}')">Éditer</button>
      <button onclick="deleteRoster('${r.id}')">Suppr.</button>
    </div>
  </div>`;
}

function renderRosterForm(){
  const wrap = document.getElementById('rosterFormWrap');
  if(rosterEditingId === undefined){ wrap.innerHTML=''; return; }
  const editing = rosterEditingId ? roster.find(r=>r.id===rosterEditingId) : null;
  const d = editing ? editing.disciplines||[] : [];
  wrap.innerHTML = `<div class="roster-form">
    <div class="roster-form-title">nom</div>
    <input id="rf-name" placeholder="ex: Grand Méchant" value="${editing?esc(editing.name):''}">
    <div class="roster-form-title">hp</div>
    <input id="rf-hp" type="number" min="1" value="${editing?editing.hp:7}">
    <div class="roster-form-title">arme</div>
    <input id="rf-arme" placeholder="ex: Griffes" value="${editing&&editing.arme?esc(editing.arme):''}">
    <div class="roster-form-title">clan (catalogue de disciplines automatique)</div>
    <select id="rf-clan">
      <option value="">— aucun / personnalisé —</option>
      ${Object.keys(CLAN_DISCIPLINES).map(c=>`<option value="${esc(c)}" ${editing&&editing.clan===c?'selected':''}>${esc(c)}</option>`).join('')}
    </select>
    <div class="roster-form-title">portrait (optionnel)</div>
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:6px;">
      <div id="rf-preview">${editing&&editing.image?`<img src="${editing.image}" style="width:56px;height:56px;border-radius:50%;object-fit:cover;">`:''}</div>
      <input type="file" accept="image/*" onchange="onRosterImageChange(this)" style="flex:1;">
      <button type="button" class="small-link" onclick="clearRosterImage()">Retirer</button>
    </div>
    <div class="roster-form-title">disciplines personnalisées (optionnel, en plus du clan)</div>
    <div class="disc-row"><input id="rf-d1n" placeholder="discipline 1" value="${d[0]?esc(d[0].name):''}"><input id="rf-d1j" placeholder="jet" value="${d[0]?esc(d[0].jet):''}"></div>
    <div class="disc-row"><input id="rf-d2n" placeholder="discipline 2" value="${d[1]?esc(d[1].name):''}"><input id="rf-d2j" placeholder="jet" value="${d[1]?esc(d[1].jet):''}"></div>
    <div class="disc-row"><input id="rf-d3n" placeholder="discipline 3" value="${d[2]?esc(d[2].name):''}"><input id="rf-d3j" placeholder="jet" value="${d[2]?esc(d[2].jet):''}"></div>
    <div style="display:flex; gap:8px; margin-top:6px;">
      <button class="btn" style="flex:1; padding:8px;" onclick="commitRoster()">Enregistrer</button>
      <button class="btn ghost" style="flex:1; padding:8px;" onclick="closeRosterForm()">Annuler</button>
    </div>
  </div>`;
}

function enemiesWithDisplayNames(){
  const counts = {};
  state.enemies.forEach(e=>{ counts[e.baseName] = (counts[e.baseName]||0)+1; });
  const seen = {};
  return state.enemies.map(e=>{
    let label = e.baseName;
    if(counts[e.baseName] > 1){
      seen[e.baseName] = (seen[e.baseName]||0)+1;
      label = `${e.baseName} ${seen[e.baseName]}`;
    }
    return Object.assign({}, e, {name: label});
  });
}

function render(){
  enemiesViewCache = enemiesWithDisplayNames();

  document.body.dataset.locked = state.locked ? 'true' : 'false';
  document.getElementById('lockBtn').textContent = state.locked ? '🔒 Verrouillé (combat)' : '🔓 Déverrouillé (édition)';
  document.getElementById('lockBtn').className = 'btn' + (state.locked ? ' lock-on' : '');
  document.getElementById('viewToggleBtn').textContent = DISPLAY_MODE ? '✏️ Vue édition' : '🎭 Vue joueurs';

  document.getElementById('playersList').innerHTML = state.players.map(playerCardHTML).join('');
  document.getElementById('enemiesList').innerHTML = enemiesViewCache.length
    ? enemiesViewCache.map(enemyCardHTML).join('')
    : '<p style="color:var(--text-dim); font-size:0.85rem;">Aucun ennemi pour l\'instant — ajoutez-en depuis le pool ou le répertoire.</p>';

  document.getElementById('centerPlayer').innerHTML = centerSlotHTML('player');
  document.getElementById('centerEnemy').innerHTML = centerSlotHTML('enemy');

  document.getElementById('poolSelect').innerHTML = ENEMY_POOL.map((t,i)=>`<option value="${i}">${esc(t.label)} (${t.hpMin}-${t.hpMax} PV)</option>`).join('');

  document.getElementById('poolImagesList').innerHTML = PORTRAIT_CATEGORIES.map(cat=>{
    const imgs = portraitPools[cat] || [];
    const thumbs = imgs.map((src,idx)=>`
      <span class="pool-thumb">
        <img src="${src}" style="width:40px;height:40px;border-radius:6px;object-fit:cover;">
        <button class="pool-thumb-remove" onclick="removePoolImage('${cat}', ${idx})" title="Retirer">×</button>
      </span>`).join('');
    return `<div class="pool-cat-row">
      <div class="pool-cat-label">${esc(PORTRAIT_CATEGORY_LABELS[cat])} <small>(${imgs.length})</small></div>
      <div class="pool-cat-thumbs">${thumbs}</div>
      <button class="small-link" onclick="pickPortraitPoolFile('${cat}')">+ Image</button>
    </div>`;
  }).join('');

  document.getElementById('rosterList').innerHTML = roster.length
    ? roster.map(rosterEntryHTML).join('')
    : '<p style="color:var(--text-dim); font-size:0.85rem;">Répertoire vide.</p>';

  renderRosterForm();
}

function onMusicFileChosen(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const url = URL.createObjectURL(file);
  const audio = document.getElementById('combatAudio');
  audio.src = url;
  document.getElementById('musicFileName').textContent = file.name;
  document.getElementById('musicPickBtn').style.display = 'none';
  document.getElementById('musicControls').style.display = 'flex';
  audio.play().catch(()=>{});
}

function toggleMusicPlay(){
  const audio = document.getElementById('combatAudio');
  if(audio.paused){ audio.play().catch(()=>{}); } else { audio.pause(); }
}

function clearMusic(){
  const audio = document.getElementById('combatAudio');
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
  document.getElementById('musicFileInput').value = '';
  document.getElementById('musicPickBtn').style.display = 'inline-block';
  document.getElementById('musicControls').style.display = 'none';
}

(function setupMusicButtonSync(){
  const audio = document.getElementById('combatAudio');
  const btn = document.getElementById('musicPlayBtn');
  if(!audio || !btn) return;
  audio.addEventListener('play', ()=>{ btn.textContent = '⏸️'; });
  audio.addEventListener('pause', ()=>{ btn.textContent = '▶️'; });
})();

loadState();
render();
</script>
</body>
</html>
